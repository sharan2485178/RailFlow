# ── Server ──────────────────────────────────────────────────────
server.port=8081

# ── App ─────────────────────────────────────────────────────────
app.base-url=http://localhost:8081

# ── Database (MySQL) ────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/railflow
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Kamnizant@123vip

# ── JPA ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JWT ─────────────────────────────────────────────────────────
jwt.secret=ThisIsAVeryLongAndSecureSecretKeyForRailFlowAppThatIsAtLeast256BitsLong
jwt.expiration=86400000

# ── Mail (disabled for dev — configure real credentials for prod)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
